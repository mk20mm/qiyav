name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            # 用户/组织站点部署在域名根路径
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "url=https://${repo%,*}" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
            echo "url=https://${GITHUB_REPOSITORY%/*}.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.base.outputs.url }}
        run: npm run build

      - name: Flatten basePath output for project site
        if: steps.base.outputs.path != ''
        run: |
          set -euo pipefail
          # 带 basePath 构建时，vinext 按 URL 路径镜像输出：
          #   首页 -> dist/client/<basePath>.html
          #   其余 -> dist/client/<basePath>/...
          # GitHub Pages 项目站点把产物挂载在 /<basePath>/ 下，因此需要
          # 把这一层展开到产物根目录，首页改名为 index.html。
          # 注意用 cp -a "<dir>/." 而非 mv "<dir>"/*，后者会漏掉隐藏文件。
          base="${{ steps.base.outputs.path }}"
          base="${base#/}"
          if [ -d "dist/client/$base" ]; then
            cp -a "dist/client/$base/." dist/client/
            rm -rf "dist/client/$base"
          fi
          if [ -f "dist/client/$base.html" ]; then
            mv "dist/client/$base.html" dist/client/index.html
          fi
          touch dist/client/.nojekyll

      - name: Verify build output
        run: |
          test -f dist/client/index.html || { echo "::error::dist/client/index.html is missing"; exit 1; }
          test -d dist/client/_next || { echo "::error::dist/client/_next is missing"; exit 1; }
          echo "--- dist/client ---"
          ls -la dist/client

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
